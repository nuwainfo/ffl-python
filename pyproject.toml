[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ffl-python"
version = "0.1.4"
description = "Python binding for FastFileLink, backed by the portable ffl.com APE"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "ffl-python contributors"}]
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/nuwainfo/ffl-python"

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2", "PyYAML>=6.0", "setuptools>=68", "wheel>=0.42"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ffl = ["bin/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
